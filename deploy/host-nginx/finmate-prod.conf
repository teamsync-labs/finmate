# Хостовый nginx: finmate.space (prod, TLS via Certbot).
# На VPS: /etc/nginx/sites-available/finmate-prod.conf → symlink в sites-enabled.
# После правок: nginx -t && systemctl reload nginx
#
# Upstream: compose-nginx на 127.0.0.1:3111 (ACCESS_VIA_DOMAIN=true).
# Cert paths: /etc/letsencrypt/live/finmate.space/

# www → apex
server {
    server_name www.finmate.space;
    return 301 https://finmate.space$request_uri;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/finmate.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/finmate.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# prod → compose-nginx :3111
server {
    server_name finmate.space;

    client_max_body_size 20m;

    # Путь = $SERVER_PATH/deploy/host-nginx/maintenance.html на VPS
    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        alias /var/www/finmate/prod/deploy/host-nginx/maintenance.html;
        default_type text/html;
        charset utf-8;
    }

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/finmate.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/finmate.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = finmate.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name finmate.space;
    return 404; # managed by Certbot
}

server {
    if ($host = www.finmate.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name www.finmate.space;
    return 404; # managed by Certbot
}
