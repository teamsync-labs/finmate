openapi: 3.0.3
info:
  title: FinSight API
  description: API финансового помощника с автоматической категоризацией и учётом расходов
  version: 1.0.0
  contact:
    name: Команда FinSight
    email: dev@finsight.example.com

servers:
  - url: http://localhost:8000
    description: Локальный сервер разработки

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-токен, полученный через POST /api/v1/auth/telegram

  schemas:
    # --- Аутентификация через Telegram ---
    TelegramAuth:
      type: object
      required: [telegram_id]
      properties:
        telegram_id:
          type: integer
          description: ID пользователя в Telegram (обязательное поле, вся валидация идёт по нему)
        username:
          type: string
          nullable: true
          description: Telegram username (без @). Если не передан — backend подставит str(telegram_id)

    AuthResponse:
      type: object
      required: [access_token, token_type, telegram_id]
      properties:
        access_token:
          type: string
          description: JWT-токен для авторизации в защищённых эндпоинтах
        token_type:
          type: string
          example: bearer
        telegram_id:
          type: integer
        username:
          type: string
          nullable: true

    # --- Расходы ---
    ExpenseCreate:
      type: object
      required: [expense_name]
      properties:
        expense_name:
          type: string
          maxLength: 100
          description: Название расхода (обязательное, не может быть пустым)
        amount:
          type: number
          format: double
          default: 0.0
          minimum: 0
          description: Сумма расхода
        type:
          type: string
          enum: [general, food, transport, housing, utilities, entertainment, health, education, shopping, other]
          default: general
          description: Категория расхода
        currency:
          type: string
          maxLength: 3
          default: RUB
          description: ISO-код валюты (3 буквы, приводится к верхнему регистру)

    ExpenseUpdate:
      type: object
      description: Все поля опциональны — обновляются только переданные
      properties:
        expense_name:
          type: string
          maxLength: 100
        amount:
          type: number
          format: double
          minimum: 0
        type:
          type: string
          enum: [general, food, transport, housing, utilities, entertainment, health, education, shopping, other]
        currency:
          type: string
          maxLength: 3

    ExpenseResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        expense_name:
          type: string
        amount:
          type: number
          format: double
        type:
          type: string
          nullable: true
        currency:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string

  parameters:
    expenseIdParam:
      name: expense_id
      in: path
      required: true
      schema:
        type: integer
      description: ID расхода

# --------------------------------------------------------------------------
paths:
  # ========================= Аутентификация =========================
  /api/v1/auth/telegram:
    post:
      tags: [Auth]
      summary: Вход/регистрация через Telegram
      description: >
        Если пользователь с таким telegram_id не найден — создаётся новый,
        username по умолчанию равен str(telegram_id).
        Если найден — обновляется username (если передан).
        В ответе возвращаются JWT-токен и данные пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuth'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ========================= Расходы ===============================
  /api/v1/expenses:
    get:
      tags: [Expenses]
      summary: Список расходов текущего пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [general, food, transport, housing, utilities, entertainment, health, education, shopping, other]
          description: Фильтр по типу расхода
      responses:
        '200':
          description: Массив расходов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Expenses]
      summary: Создать расход
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Расход создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации (например, недопустимый type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/expenses/{expense_id}:
    get:
      tags: [Expenses]
      summary: Получить расход по ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/expenseIdParam'
      responses:
        '200':
          description: Данные расхода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Расход не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Expenses]
      summary: Обновить расход
      description: Обновляются только переданные поля
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/expenseIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          description: Расход обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Расход не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Expenses]
      summary: Удалить расход
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/expenseIdParam'
      responses:
        '204':
          description: Расход удалён
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Расход не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ========================= Служебные =============================
  /:
    get:
      tags: [Health]
      summary: Корень API
      responses:
        '200':
          description: Приветственное сообщение
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /health:
    get:
      tags: [Health]
      summary: Проверка здоровья сервиса и состояния БД
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
